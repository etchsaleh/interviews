<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PyPractice{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">py<span>practice</span></a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index', 'problem_page') }}">Problems</a>
      <a href="{{ url_for('plan') }}" class="{{ 'active' if request.endpoint == 'plan' }}">Study Plan</a>
      <a href="{{ url_for('system_design') }}" class="{{ 'active' if request.endpoint == 'system_design' }}">System Design</a>
      <a href="{{ url_for('fde_page') }}" class="{{ 'active' if request.endpoint == 'fde_page' }}">Role Prep</a>
      <a href="{{ url_for('playground') }}" class="{{ 'active' if request.endpoint == 'playground' }}">Playground</a>
      <a href="{{ url_for('guide') }}" class="{{ 'active' if request.endpoint == 'guide' }}">Python Guide</a>
    </nav>
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
